linters-settings:
  cyclop:
    max-complexity: 15
  depguard:
    rules:
      main:
        allow:
          - $gostd
          - github.com/architeacher/colorize
        files:
          - "*.go"
  forbidigo:
    forbid:
      - ^print.*$
  mnd:
    checks:
#      - argument
      - assign
      - case
      - condition
#      - operation
      - return

linters:
  enable-all: true
  disable:
    - asasalint
    - execinquery
    - exhaustruct
    - forcetypeassert
    - gochecknoglobals
    - godot
    - ireturn
    - wrapcheck

issues:
  exclude-dirs:
    - .circleci
    - .github
    - .githooks
    - .go
    - .travis
    - assets
    - build

run:
  concurrency: 15
  tests: false
  timeout: 3m

output:
  formats:
    - format: json
      path: stderr
    - format: checkstyle
      path: report.xml
    - format: colored-line-number
